<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoTrace VASP — Wallet Attribution</title>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #060812;
    --grid-line: rgba(255, 61, 138, 0.035);

    --panel: #0D0F1C;
    --panel-raised: #131629;

    --border: #211F3A;
    --border-bright: #362F5C;

    --text: #DCE0F2;
    --text-dim: #5F6285;

    --accent: #43E6C4;
    --accent-glow: rgba(67, 230, 196, 0.35);

    --pink: #FF3D8A;
    --pink-glow: rgba(255, 61, 138, 0.4);

    --flag: #F0A857;
    --flag-glow: rgba(240, 168, 87, 0.25);

    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;

    background:
      radial-gradient(
        ellipse 900px 500px at 15% -5%,
        rgba(255, 61, 138, 0.10),
        transparent 60%
      ),
      radial-gradient(
        ellipse 900px 500px at 90% 10%,
        rgba(67, 230, 196, 0.08),
        transparent 60%
      ),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--bg);

    background-size:
      auto,
      auto,
      28px 28px,
      28px 28px,
      auto;

    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;

    display: flex;
    align-items: center;
    gap: 14px;

    background:
      linear-gradient(
        180deg,
        rgba(6, 8, 18, 0.9),
        rgba(6, 8, 18, 0.6)
      );

    backdrop-filter: blur(6px);
  }

  .scope-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .scope-icon .ring {
    fill: none;
    stroke: var(--border-bright);
    stroke-width: 1;
  }

  .scope-icon .tick {
    stroke: var(--text-dim);
    stroke-width: 1;
  }

  .scope-icon .sweep {
    transform-origin: 11px 11px;
    animation: sweep 3.2s linear infinite;
  }

  .scope-icon .crosshair {
    fill: var(--accent);
  }

  @keyframes sweep {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;

    margin: 0;
    letter-spacing: 0.02em;

    background:
      linear-gradient(
        90deg,
        var(--accent) 0%,
        #7FE6D8 35%,
        var(--pink) 100%
      );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header .tag {
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: var(--mono);

    border-left: 1px solid var(--border);
    padding-left: 14px;
  }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 32px;
  }

  .search-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);

    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }

  #addressInput {
    flex: 1;

    background: var(--panel);
    border: 1px solid var(--border);

    color: var(--text);

    padding: 13px 16px;
    border-radius: 3px;

    font-family: var(--mono);
    font-size: 13px;

    outline: none;

    transition:
      border-color 0.15s,
      box-shadow 0.15s;
  }

  #addressInput:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px var(--pink-glow);
  }

  #addressInput::placeholder {
    color: var(--text-dim);
  }

  #addressInput.invalid {
    border-color: #E15C5C;
  }

  .input-error {
    font-family: var(--mono);
    font-size: 11px;
    color: #E15C5C;

    margin-bottom: 24px;
    min-height: 14px;
  }

  button {
    position: relative;

    background: transparent;
    color: var(--accent);

    border: 1px solid var(--accent);

    padding: 13px 28px;

    font-weight: 700;
    font-size: 12.5px;

    font-family: var(--mono);
    letter-spacing: 0.08em;

    cursor: pointer;

    clip-path:
      polygon(
        10px 0,
        100% 0,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        0 100%,
        0 10px
      );

    overflow: hidden;
    transition: color 0.2s, border-color 0.2s;
    isolation: isolate;
  }

  button::before {
    content: '';

    position: absolute;
    inset: 0;

    background:
      linear-gradient(
        120deg,
        var(--accent) 0%,
        var(--pink) 100%
      );

    transform: translateX(-105%);
    transition: transform 0.28s ease;

    z-index: -1;
  }

  button:hover {
    color: #04140F;
    border-color: var(--pink);
  }

  button:hover::before {
    transform: translateX(0);
  }

  button:active {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;

    border-color: var(--border-bright);
    color: var(--text-dim);
  }

  button:disabled::before {
    display: none;
  }

  .btn-arrow {
    display: inline-block;
    transition: transform 0.2s;
  }

  button:hover .btn-arrow {
    transform: translateX(3px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-dim);

    border: 1px solid var(--border-bright);

    padding: 8px 16px;

    font-size: 11px;

    clip-path: none;
    font-weight: 600;
  }

  .btn-secondary::before {
    display: none;
  }

  .btn-secondary:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: 4px;

    padding: 60px 24px;

    text-align: center;

    color: var(--text-dim);

    font-size: 13px;
    font-family: var(--mono);
  }

  .summary-grid {
    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 1px;

    background: var(--border);

    border: 1px solid var(--border);
    border-radius: 4px;

    overflow: hidden;

    margin-bottom: 12px;

    position: relative;
  }

  .summary-grid::before {
    content: '';

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 2px;

    background:
      linear-gradient(
        90deg,
        var(--accent),
        var(--pink)
      );
  }

  .stat {
    background: var(--panel);

    padding: 18px 20px;

    position: relative;
  }

  .stat .label {
    font-size: 10.5px;
    color: var(--text-dim);

    margin-bottom: 8px;

    font-family: var(--mono);

    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .stat .value {
    font-size: 21px;

    font-weight: 700;

    font-family: var(--mono);
  }

  .stat .value.accent {
    color: var(--accent);
    text-shadow: 0 0 16px var(--accent-glow);
  }

  .stat .value.pink {
    color: var(--pink);
    text-shadow: 0 0 16px var(--pink-glow);
  }

  .stat .value.muted {
    color: var(--text-dim);

    font-size: 15px;
    font-weight: 500;
  }

  .confidence-bar {
    height: 3px;

    background: var(--panel-raised);

    border-radius: 2px;

    margin-top: 10px;

    overflow: hidden;
  }

  .confidence-fill {
    height: 100%;

    background:
      linear-gradient(
        90deg,
        var(--pink),
        var(--accent)
      );

    box-shadow: 0 0 8px var(--accent-glow);
  }

  .hop-note {
    font-family: var(--mono);
    font-size: 11px;

    color: var(--text-dim);

    margin-bottom: 16px;

    padding: 0 2px;
  }

  .hop-note span {
    color: var(--pink);
  }

  .flag-row {
    display: flex;

    align-items: center;

    gap: 10px;

    background: var(--panel);

    border: 1px solid var(--flag);

    box-shadow:
      0 0 20px -8px var(--flag-glow);

    color: var(--flag);

    padding: 12px 16px;

    border-radius: 4px;

    font-size: 12px;

    margin-bottom: 20px;

    font-family: var(--mono);
  }

  .flag-icon {
    width: 16px;
    height: 16px;

    border: 1px solid var(--flag);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 10px;

    flex-shrink: 0;
  }

  .panel-header {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    margin-bottom: 10px;
  }

  .panel-title {
    font-size: 11px;

    color: var(--text-dim);

    text-transform: uppercase;

    letter-spacing: 0.05em;

    font-family: var(--mono);
  }

  .panel-meta {
    font-size: 10.5px;

    color: var(--text-dim);

    font-family: var(--mono);
  }

  #graph {
    background:
      radial-gradient(
        circle at 25% 15%,
        rgba(67, 230, 196, 0.05),
        transparent 40%
      ),
      radial-gradient(
        circle at 80% 85%,
        rgba(255, 61, 138, 0.05),
        transparent 40%
      ),
      var(--panel);

    border: 1px solid var(--border);

    border-radius: 4px;

    height: 560px;
  }

  .legend {
    display: flex;

    gap: 20px;

    margin-top: 10px;

    font-family: var(--mono);

    font-size: 10.5px;

    color: var(--text-dim);

    flex-wrap: wrap;
  }

  .legend .dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    display: inline-block;

    margin-right: 6px;

    vertical-align: middle;
  }

  .section {
    margin-top: 20px;
  }

  .info-grid {
    display: grid;

    grid-template-columns:
      repeat(2, 1fr);

    gap: 12px;
  }

  .info-card {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 4px;

    padding: 16px;
  }

  .info-card-title {
    color: var(--text-dim);

    font-family: var(--mono);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 0.05em;

    margin-bottom: 12px;
  }

  .info-value {
    font-family: var(--mono);

    color: var(--text);

    font-size: 12px;

    line-height: 1.7;
  }

  .info-value strong {
    color: var(--accent);
  }

  .vasp-highlight {
    color: var(--pink);

    text-shadow:
      0 0 10px var(--pink-glow);

    font-weight: 700;
  }

  .cluster-list {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 8px;
  }

  .cluster-chip {
    background: var(--panel-raised);

    border: 1px solid var(--border-bright);

    color: var(--text-dim);

    padding: 6px 9px;

    border-radius: 3px;

    font-family: var(--mono);

    font-size: 10px;
  }

  .cluster-chip.active {
    border-color: var(--accent);

    color: var(--accent);

    box-shadow:
      0 0 10px var(--accent-glow);
  }

  .connection-row {
    display: flex;

    justify-content: space-between;

    gap: 12px;

    padding: 8px 0;

    border-bottom: 1px solid var(--border);
  }

  .connection-row:last-child {
    border-bottom: none;
  }

  .connection-address {
    color: var(--text);

    font-family: var(--mono);

    font-size: 10px;

    word-break: break-all;
  }

  .connection-name {
    color: var(--pink);

    font-family: var(--mono);

    font-size: 10px;

    font-weight: 700;
  }

  .footer-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 14px;
  }

  .footer-note {
    font-size: 11px;

    color: var(--text-dim);

    font-family: var(--mono);
  }

  .loading {
    color: var(--pink);

    font-size: 13px;

    padding: 24px 0;

    font-family: var(--mono);
  }

  .loading::after {
    content: '▍';

    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  @media (max-width: 800px) {
    main {
      padding: 24px 16px;
    }

    header {
      padding: 16px;
    }

    header .tag {
      display: none;
    }

    .summary-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .info-grid {
      grid-template-columns: 1fr;
    }

    .search-row {
      flex-direction: column;
    }

    #graph {
      height: 500px;
    }
  }
</style>
</head>

<body>

<header>

  <svg class="scope-icon" viewBox="0 0 22 22">

    <circle
      class="ring"
      cx="11"
      cy="11"
      r="9.5"
    />

    <circle
      class="ring"
      cx="11"
      cy="11"
      r="5.5"
      opacity="0.6"
    />

    <line
      class="tick"
      x1="11"
      y1="1"
      x2="11"
      y2="3"
    />

    <line
      class="tick"
      x1="11"
      y1="19"
      x2="11"
      y2="21"
    />

    <line
      class="tick"
      x1="1"
      y1="11"
      x2="3"
      y2="11"
    />

    <line
      class="tick"
      x1="19"
      y1="11"
      x2="21"
      y2="11"
    />

    <g class="sweep">

      <path
        d="M 11 11 L 11 1.5 A 9.5 9.5 0 0 1 18.7 5.3 Z"
        fill="url(#sweepGrad)"
        opacity="0.55"
      />

    </g>

    <circle
      class="crosshair"
      cx="11"
      cy="11"
      r="1.6"
    />

    <defs>

      <linearGradient
        id="sweepGrad"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
      >

        <stop
          offset="0%"
          stop-color="#43E6C4"
        />

        <stop
          offset="100%"
          stop-color="#43E6C4"
          stop-opacity="0"
        />

      </linearGradient>

    </defs>

  </svg>

  <h1>
    CRYPTOTRACE // VASP-ATTRIBUTION
  </h1>

  <span class="tag">
    SIH26182 · graph intelligence prototype
  </span>

</header>


<main>

  <div class="search-label">
    $ trace --address
  </div>

  <div class="search-row">

    <input
      id="addressInput"
      type="text"
      placeholder="0x..."
      value=""
    >

    <button
      id="searchBtn"
      onclick="lookup()"
    >
      RUN TRACE
      <span class="btn-arrow">→</span>
    </button>

  </div>

  <div
    class="input-error"
    id="inputError"
  ></div>


  <div id="output">

    <div class="empty-state">
      // awaiting input — enter a wallet address and run trace
    </div>

  </div>

</main>


<script>

  let sweepIntervalId = null;

  let lastResult = null;


  /*
   * ============================================================
   * ADDRESS VALIDATION
   * ============================================================
   */

  function isValidAddress(addr) {

    return /^0x[a-fA-F0-9]{40}$/.test(addr);

  }


  /*
   * ============================================================
   * LOOKUP
   * ============================================================
   */

  async function lookup() {

    const address =
      document
        .getElementById('addressInput')
        .value
        .trim();

    const btn =
      document.getElementById('searchBtn');

    const output =
      document.getElementById('output');

    const input =
      document.getElementById('addressInput');

    const errorEl =
      document.getElementById('inputError');


    errorEl.textContent = '';

    input.classList.remove('invalid');


    if (!address) {

      errorEl.textContent =
        '// enter an Ethereum wallet address';

      input.classList.add('invalid');

      return;

    }


    if (!isValidAddress(address)) {

      errorEl.textContent =
        '// invalid format — expected a 42-character 0x address';

      input.classList.add('invalid');

      return;

    }


    btn.disabled = true;


    output.innerHTML =
      '<div class="loading">tracing graph activity</div>';


    try {

      const res =
        await fetch(
          `http://localhost:5000/api/attribute?address=${encodeURIComponent(address)}`
        );


      const data =
        await res.json();


      if (!res.ok || data.error) {

        throw new Error(
          data.message || data.error || 'Backend request failed'
        );

      }


      lastResult = data;

      renderResult(data);

    }

    catch (err) {

      output.innerHTML = `
        <div class="empty-state">
          // error — ${escapeHtml(err.message)}
        </div>
      `;

    }

    finally {

      btn.disabled = false;

    }

  }


  /*
   * ============================================================
   * HTML ESCAPE
   * ============================================================
   */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return '';
    }

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  /*
   * ============================================================
   * SHORT ADDRESS
   * ============================================================
   */

  function shortAddress(address) {

    if (!address) {
      return '—';
    }

    return (
      address.slice(0, 10) +
      '…' +
      address.slice(-6)
    );

  }


  /*
   * ============================================================
   * RENDER RESULT
   * ============================================================
   */

  function renderResult(data) {

    const output =
      document.getElementById('output');


    const conf =
      Number(data.confidence || 0);


    const flags =
      Array.isArray(data.flags)
        ? data.flags
        : [];


    const graph =
      data.graph_analysis || {};


    const nearestVasp =
      graph.nearest_vasp || null;


    const graphNodes =
      Array.isArray(graph.graph_nodes)
        ? graph.graph_nodes
        : [];


    const graphEdges =
      Array.isArray(graph.graph_edges)
        ? graph.graph_edges
        : [];


    const clusters =
      Array.isArray(graph.clusters)
        ? graph.clusters
        : [];


    /*
     * ----------------------------------------------------------
     * HOP MESSAGE
     * ----------------------------------------------------------
     */

    let hopMessage = '';


    if (
      data.matched_vasp &&
      data.hops === 0
    ) {

      hopMessage = `
        <div class="hop-note">
          // <span>direct</span> VASP match
        </div>
      `;

    }

    else if (
      data.matched_vasp &&
      data.hops > 0 &&
      data.matched_via
    ) {

      hopMessage = `
        <div class="hop-note">
          // matched VASP
          <span>${data.hops} hop${data.hops > 1 ? 's' : ''}</span>
          away through
          ${escapeHtml(shortAddress(data.matched_via))}
        </div>
      `;

    }

    else {

      hopMessage = `
        <div class="hop-note">
          // no VASP found within current graph
        </div>
      `;

    }


    /*
     * ----------------------------------------------------------
     * FLAGS
     * ----------------------------------------------------------
     */

    let flagsHtml = '';


    if (flags.length > 0) {

      const flagText =
        flags
          .map(flag => {

            if (
              typeof flag === 'string'
            ) {

              return flag
                .replace(/_/g, ' ')
                .toUpperCase();

            }


            if (
              flag &&
              flag.type === 'repeated_transaction'
            ) {

              return (
                'REPEATED TRANSACTION × ' +
                flag.count
              );

            }


            return 'SUSPICIOUS ACTIVITY';

          })
          .join(' · ');


      flagsHtml = `
        <div class="flag-row">

          <span class="flag-icon">
            !
          </span>

          FLAGGED — ${escapeHtml(flagText)}

        </div>
      `;

    }


    /*
     * ----------------------------------------------------------
     * VASP EVIDENCE
     * ----------------------------------------------------------
     */

    let vaspEvidenceHtml = '';


    if (
      nearestVasp &&
      nearestVasp.address
    ) {

      vaspEvidenceHtml = `

        <div class="info-card">

          <div class="info-card-title">
            Graph VASP Evidence
          </div>

          <div class="info-value">

            <div>
              VASP:
              <strong class="vasp-highlight">
                ${escapeHtml(
                  nearestVasp.vasp_name || data.matched_vasp || 'Unknown'
                )}
              </strong>
            </div>

            <div>
              Matched wallet:
              <span class="connection-address">
                ${escapeHtml(
                  nearestVasp.address
                )}
              </span>
            </div>

            <div>
              Graph distance:
              <strong>
                ${escapeHtml(
                  nearestVasp.hops
                )}
                hop${nearestVasp.hops === 1 ? '' : 's'}
              </strong>
            </div>

            ${
              Array.isArray(nearestVasp.path)
              ? `
                <div style="margin-top:8px;">
                  Path:
                </div>

                <div
                  class="connection-address"
                  style="line-height:1.8;"
                >
                  ${nearestVasp.path
                    .map(address =>
                      escapeHtml(shortAddress(address))
                    )
                    .join(' → ')
                  }
                </div>
              `
              : ''
            }

          </div>

        </div>

      `;

    }


    /*
     * ----------------------------------------------------------
     * CLUSTER STATS
     * ----------------------------------------------------------
     */

    let clusterStatsHtml = '';


    if (
      graph.suspect_cluster &&
      clusters.length > 0
    ) {

      const suspectCluster =
        clusters.find(
          cluster =>
            Number(cluster.cluster_id) ===
            Number(graph.suspect_cluster)
        );


      if (suspectCluster) {

        clusterStatsHtml = `

          <div class="info-card">

            <div class="info-card-title">
              Suspect Cluster Statistics
            </div>

            <div class="info-value">

              <div>
                Cluster:
                <strong>
                  #${escapeHtml(
                    suspectCluster.cluster_id
                  )}
                </strong>
              </div>

              <div>
                Wallets:
                <strong>
                  ${escapeHtml(
                    suspectCluster.wallet_count
                  )}
                </strong>
              </div>

              <div>
                Internal edges:
                <strong>
                  ${escapeHtml(
                    suspectCluster.internal_edges
                  )}
                </strong>
              </div>

              <div>
                Transaction weight:
                <strong>
                  ${escapeHtml(
                    suspectCluster.total_transaction_weight
                  )}
                </strong>
              </div>

              <div>
                Average degree:
                <strong>
                  ${escapeHtml(
                    suspectCluster.average_degree
                  )}
                </strong>
              </div>

            </div>

          </div>

        `;

      }

    }


    /*
     * ----------------------------------------------------------
     * VASP CONNECTIONS
     * ----------------------------------------------------------
     */

    let connectionsHtml = '';


    const vaspConnections =
      Array.isArray(graph.vasp_connections)
        ? graph.vasp_connections
        : [];


    if (vaspConnections.length > 0) {

      connectionsHtml = `

        <div class="info-card">

          <div class="info-card-title">
            VASP Connections Inside Suspect Cluster
          </div>

          <div class="info-value">

            ${
              vaspConnections
                .map(connection => {

                  const address =
                    connection.address ||
                    connection.vasp_address ||
                    '';

                  const name =
                    connection.vasp_name ||
                    connection.name ||
                    'Unknown';


                  return `

                    <div class="connection-row">

                      <span
                        class="connection-address"
                      >
                        ${escapeHtml(
                          shortAddress(address)
                        )}
                      </span>

                      <span
                        class="connection-name"
                      >
                        ${escapeHtml(name)}
                      </span>

                    </div>

                  `;

                })
                .join('')
            }

          </div>

        </div>

      `;

    }


    /*
     * ----------------------------------------------------------
     * MAIN RESULT HTML
     * ----------------------------------------------------------
     */

    let html = `

      <div class="summary-grid">

        <div class="stat">

          <div class="label">
            Root Transactions
          </div>

          <div class="value">
            ${escapeHtml(
              data.tx_count ?? 0
            )}
          </div>

        </div>


        <div class="stat">

          <div class="label">
            Matched VASP
          </div>

          <div
            class="value ${
              data.matched_vasp
                ? 'pink'
                : 'muted'
            }"
          >
            ${
              escapeHtml(
                data.matched_vasp ||
                'NO MATCH'
              )
            }
          </div>

        </div>


        <div class="stat">

          <div class="label">
            Confidence
          </div>

          <div
            class="value ${
              conf > 0
                ? 'accent'
                : 'muted'
            }"
          >
            ${conf}%
          </div>

          <div class="confidence-bar">

            <div
              class="confidence-fill"
              style="width:${Math.min(conf, 100)}%"
            ></div>

          </div>

        </div>


        <div class="stat">

          <div class="label">
            Graph Cluster
          </div>

          <div class="value accent">

            ${
              graph.suspect_cluster
                ? '#' +
                  escapeHtml(
                    graph.suspect_cluster
                  )
                : '—'
            }

          </div>

        </div>

      </div>


      ${hopMessage}


      ${flagsHtml}


      <div class="panel-header">

        <span class="panel-title">
          Transaction Graph
        </span>

        <span class="panel-meta">

          ${escapeHtml(
            graph.nodes ?? graphNodes.length
          )}
          nodes ·

          ${escapeHtml(
            graph.edges ?? graphEdges.length
          )}
          edges ·

          ${escapeHtml(
            clusters.length
          )}
          clusters

        </span>

      </div>


      <div id="graph"></div>


      <div class="legend">

        <span>
          <span
            class="dot"
            style="background:#43E6C4;"
          ></span>
          Searched address
        </span>


        <span>
          <span
            class="dot"
            style="background:#FF3D8A;"
          ></span>
          Matched VASP
        </span>


        <span>
          <span
            class="dot"
            style="background:#7B6FE8;"
          ></span>
          Same cluster
        </span>


        <span>
          <span
            class="dot"
            style="background:#5F6285;"
          ></span>
          Other wallet
        </span>

      </div>


      <div class="section">

        <div class="panel-header">

          <span class="panel-title">
            Graph Intelligence
          </span>

          <span class="panel-meta">
            NetworkX · Louvain · BFS
          </span>

        </div>


        <div class="info-grid">

          ${vaspEvidenceHtml}

          ${clusterStatsHtml}

          ${connectionsHtml}

          <div class="info-card">

            <div class="info-card-title">
              Graph Trace Metrics
            </div>

            <div class="info-value">

              <div>
                Root transactions:
                <strong>
                  ${escapeHtml(
                    data.tx_count ?? 0
                  )}
                </strong>
              </div>

              <div>
                Graph transactions:
                <strong>
                  ${escapeHtml(
                    data.graph_tx_count ?? 0
                  )}
                </strong>
              </div>

              <div>
                Wallets fetched:
                <strong>
                  ${escapeHtml(
                    data.fetched_wallet_count ?? 0
                  )}
                </strong>
              </div>

              <div>
                Trace depth:
                <strong>
                  ${escapeHtml(
                    data.trace_depth ?? 2
                  )} hops
                </strong>
              </div>

              <div>
                Suspect in-degree:
                <strong>
                  ${escapeHtml(
                    graph.suspect_in_degree ?? 0
                  )}
                </strong>
              </div>

              <div>
                Suspect out-degree:
                <strong>
                  ${escapeHtml(
                    graph.suspect_out_degree ?? 0
                  )}
                </strong>
              </div>

            </div>

          </div>

        </div>

      </div>


      <div class="footer-row">

        <div class="footer-note">

          // data source:
          ${escapeHtml(
            data.data_source || 'unknown'
          )}
          · bounded graph expansion

        </div>


        <button
          class="btn-secondary"
          onclick="exportReport()"
        >
          ↓ EXPORT JSON
        </button>

      </div>

    `;


    output.innerHTML = html;


    renderGraph(data);

  }


  /*
   * ============================================================
   * EXPORT REPORT
   * ============================================================
   */

  function exportReport() {

    if (!lastResult) {
      return;
    }


    const blob =
      new Blob(
        [
          JSON.stringify(
            lastResult,
            null,
            2
          )
        ],
        {
          type: 'application/json'
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement('a');


    a.href = url;


    a.download =
      `attribution-report-${lastResult.address.slice(0,8)}.json`;


    a.click();


    URL.revokeObjectURL(url);

  }


  /*
   * ============================================================
   * GRAPH RENDERING
   *
   * IMPORTANT:
   *
   * Matched VASP is identified using:
   *
   * data.graph_analysis.nearest_vasp.address
   *
   * NOT merely the first transaction's receiver.
   *
   * Therefore:
   *
   * Suspect → Wallet A → KuCoin
   *
   * KuCoin will be PINK.
   * ============================================================
   */

  function renderGraph(data) {

    if (sweepIntervalId) {

      clearInterval(
        sweepIntervalId
      );

      sweepIntervalId = null;

    }


    const container =
      document.getElementById('graph');


    if (!container) {
      return;
    }


    const graph =
      data.graph_analysis || {};


    const graphNodes =
      Array.isArray(graph.graph_nodes)
        ? graph.graph_nodes
        : [];


    const graphEdges =
      Array.isArray(graph.graph_edges)
        ? graph.graph_edges
        : [];


    const searchedAddress =
      String(
        data.address || ''
      ).toLowerCase();


    /*
     * THIS IS THE IMPORTANT FIX
     *
     * Backend gives us the exact VASP wallet
     * discovered by graph analysis.
     */

    const matchedVaspAddress =
      graph.nearest_vasp &&
      graph.nearest_vasp.address
        ? String(
            graph.nearest_vasp.address
          ).toLowerCase()
        : (
            data.matched_via
              ? String(
                  data.matched_via
                ).toLowerCase()
              : null
          );


    const suspectCluster =
      graph.suspect_cluster;


    /*
     * ----------------------------------------------------------
     * BUILD NODES
     * ----------------------------------------------------------
     */

    const nodes = [];


    graphNodes.forEach(
      node => {

        const nodeId =
          String(
            node.id || ''
          );


        const normalizedId =
          nodeId.toLowerCase();


        /*
         * Search wallet
         */

        const isSuspect =
          normalizedId ===
          searchedAddress;


        /*
         * EXACT MATCHED VASP
         *
         * This is what fixes the 2-hop pink issue.
         */

        const isMatchedVasp =
          matchedVaspAddress &&
          normalizedId ===
          matchedVaspAddress;


        /*
         * Same Louvain cluster
         */

        const isSameCluster =
          !isSuspect &&
          !isMatchedVasp &&
          suspectCluster !== null &&
          suspectCluster !== undefined &&
          Number(node.cluster) ===
          Number(suspectCluster);


        let background =
          '#131629';


        let border =
          '#362F5C';


        let fontColor =
          '#DCE0F2';


        let size =
          14;


        let borderWidth =
          1;


        /*
         * ------------------------------------------------------
         * NODE PRIORITY
         *
         * 1. Suspect
         * 2. Matched VASP
         * 3. Same cluster
         * 4. Other wallet
         * ------------------------------------------------------
         */

        if (isSuspect) {

          background =
            '#43E6C4';

          border =
            '#1F7A68';

          fontColor =
            '#04140F';

          size =
            26;

          borderWidth =
            2;

        }

        else if (isMatchedVasp) {

          /*
           * PINK VASP NODE
           */

          background =
            '#2A1122';

          border =
            '#FF3D8A';

          fontColor =
            '#FF3D8A';

          size =
            22;

          borderWidth =
            3;

        }

        else if (isSameCluster) {

          background =
            '#17152C';

          border =
            '#7B6FE8';

          fontColor =
            '#A69DF5';

          size =
            16;

          borderWidth =
            1.5;

        }


        nodes.push({

          id: nodeId,

          label:
            isMatchedVasp
              ? (
                  nodeId.slice(0, 6) +
                  '…\nVASP'
                )
              : (
                  nodeId.slice(0, 6) +
                  '…'
                ),

          title:
            isMatchedVasp
              ? (
                  'MATCHED VASP: ' +
                  (
                    graph.nearest_vasp
                      ?.vasp_name ||
                    data.matched_vasp ||
                    'Unknown'
                  ) +
                  '\n\n' +
                  nodeId
                )
              : nodeId,

          color: {

            background:
              background,

            border:
              border,

            highlight: {

              background:
                isMatchedVasp
                  ? '#3D1830'
                  : background,

              border:
                isMatchedVasp
                  ? '#FF3D8A'
                  : '#43E6C4'

            },

            hover: {

              background:
                isMatchedVasp
                  ? '#3D1830'
                  : background,

              border:
                isMatchedVasp
                  ? '#FF3D8A'
                  : '#43E6C4'

            }

          },

          font: {

            color:
              fontColor,

            face:
              'JetBrains Mono',

            size:
              isMatchedVasp
                ? 10
                : 9,

            bold:
              isSuspect ||
              isMatchedVasp

          },

          shape:
            'dot',

          size:
            size,

          borderWidth:
            borderWidth

        });

      }
    );


    /*
     * If backend graph_nodes somehow does not contain
     * the searched address, add it manually.
     */

    const hasSuspect =
      nodes.some(
        node =>
          String(node.id).toLowerCase() ===
          searchedAddress
      );


    if (!hasSuspect && searchedAddress) {

      nodes.push({

        id: data.address,

        label:
          data.address.slice(0, 6) +
          '…',

        title:
          data.address,

        color: {

          background:
            '#43E6C4',

          border:
            '#1F7A68'

        },

        font: {

          color:
            '#04140F',

          face:
            'JetBrains Mono',

          size:
            11,

          bold:
            true

        },

        shape:
          'dot',

        size:
          26,

        borderWidth:
          2

      });

    }


    /*
     * ----------------------------------------------------------
     * BUILD EDGES
     * ----------------------------------------------------------
     */

    const edges = [];


    graphEdges.forEach(
      (edge, index) => {

        const from =
          String(
            edge.from || ''
          );


        const to =
          String(
            edge.to || ''
          );


        if (!from || !to) {
          return;
        }


        const normalizedFrom =
          from.toLowerCase();


        const normalizedTo =
          to.toLowerCase();


        const touchesMatchedVasp =
          matchedVaspAddress &&
          (
            normalizedFrom ===
              matchedVaspAddress ||

            normalizedTo ===
              matchedVaspAddress
          );


        const touchesSuspect =
          normalizedFrom ===
            searchedAddress ||

          normalizedTo ===
            searchedAddress;


        const weight =
          Number(
            edge.weight || 1
          );


        let edgeColor =
          '#2E4463';


        let edgeWidth =
          Math.min(
            1 + weight * 0.35,
            5
          );


        if (touchesMatchedVasp) {

          /*
           * EDGE CONNECTING TO VASP ALSO PINK
           */

          edgeColor =
            '#FF3D8A';

          edgeWidth =
            Math.max(
              edgeWidth,
              2
            );

        }

        else if (touchesSuspect) {

          edgeColor =
            '#43E6C4';

        }


        edges.push({

          id:
            `edge-${index}`,

          from:
            from,

          to:
            to,

          arrows:
            'to',

          width:
            edgeWidth,

          color: {

            color:
              edgeColor,

            highlight:
              '#FF3D8A',

            hover:
              '#43E6C4',

            opacity:
              touchesMatchedVasp
                ? 1
                : 0.75

          },

          smooth: {

            enabled:
              true,

            type:
              'dynamic'

          },

          title:
            `Transactions: ${weight}`

        });

      }
    );


    /*
     * ----------------------------------------------------------
     * NETWORK
     * ----------------------------------------------------------
     */

    const network =
      new vis.Network(
        container,
        {
          nodes,
          edges
        },
        {

          physics: {

            enabled:
              true,

            stabilization: {

              enabled:
                true,

              iterations:
                400,

              updateInterval:
                50

            },

            barnesHut: {

              gravitationalConstant:
                -4200,

              centralGravity:
                0.15,

              springLength:
                130,

              springConstant:
                0.04,

              damping:
                0.22,

              avoidOverlap:
                0.7

            }

          },


          interaction: {

            hover:
              true,

            tooltipDelay:
              120,

            navigationButtons:
              true,

            keyboard:
              true,

            zoomView:
              true,

            dragView:
              true

          },


          nodes: {

            shadow: {

              enabled:
                true,

              color:
                'rgba(0,0,0,0.35)',

              size:
                8,

              x:
                0,

              y:
                3

            }

          },


          edges: {

            selectionWidth:
              2,

            hoverWidth:
              1.5

          }

        }
      );


    /*
     * ----------------------------------------------------------
     * FOCUS ON SUSPECT
     * ----------------------------------------------------------
     */

    network.once(
      'stabilizationIterationsDone',
      function () {

        if (
          network.body.data.nodes.get(
            data.address
          )
        ) {

          network.focus(
            data.address,
            {

              scale:
                0.85,

              animation: {

                duration:
                  700,

                easingFunction:
                  'easeInOutQuad'

              }

            }
          );

        }

      }
    );


    /*
     * ----------------------------------------------------------
     * CLICK BEHAVIOR
     * ----------------------------------------------------------
     */

    network.on(
      'click',
      function (params) {

        if (
          !params.nodes ||
          params.nodes.length === 0
        ) {

          return;

        }


        const clickedId =
          params.nodes[0];


        const clickedNode =
          graphNodes.find(
            node =>
              String(node.id) ===
              String(clickedId)
          );


        if (!clickedNode) {
          return;
        }


        const normalized =
          String(
            clickedNode.id
          ).toLowerCase();


        if (
          matchedVaspAddress &&
          normalized ===
          matchedVaspAddress
        ) {

          network.selectNodes(
            [clickedId]
          );

        }

      }
    );


    /*
     * ----------------------------------------------------------
     * SUSPECT ANIMATED RING
     * ----------------------------------------------------------
     */

    let sweepAngle = 0;


    network.on(
      'afterDrawing',
      function (ctx) {

        const positions =
          network.getPositions(
            [data.address]
          );


        const pos =
          positions[data.address];


        if (!pos) {
          return;
        }


        const ringRadius =
          42;


        ctx.save();


        /*
         * Outer ring
         */

        ctx.strokeStyle =
          'rgba(67,230,196,0.22)';

        ctx.lineWidth =
          1;


        ctx.beginPath();


        ctx.arc(
          pos.x,
          pos.y,
          ringRadius,
          0,
          Math.PI * 2
        );


        ctx.stroke();


        /*
         * Animated sweep
         */

        const grad =
          ctx.createLinearGradient(
            pos.x,
            pos.y,
            pos.x + ringRadius,
            pos.y
          );


        grad.addColorStop(
          0,
          'rgba(67,230,196,0.9)'
        );


        grad.addColorStop(
          1,
          'rgba(67,230,196,0)'
        );


        ctx.strokeStyle =
          grad;

        ctx.lineWidth =
          2;


        ctx.beginPath();


        ctx.arc(
          pos.x,
          pos.y,
          ringRadius,
          sweepAngle,
          sweepAngle + 0.6
        );


        ctx.stroke();


        ctx.restore();

      }
    );


    sweepIntervalId =
      setInterval(
        () => {

          sweepAngle +=
            0.035;

          network.redraw();

        },
        30
      );

  }


  /*
   * ============================================================
   * ENTER KEY SUPPORT
   * ============================================================
   */

  document
    .getElementById('addressInput')
    .addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Enter'
        ) {

          lookup();

        }

      }
    );

</script>
