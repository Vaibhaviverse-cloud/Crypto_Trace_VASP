<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CryptoTrace VASP — Wallet Attribution</title>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>

  :root {
    --bg: #060812;
    --grid-line: rgba(255, 61, 138, 0.035);
    --panel: #0D0F1C;
    --panel-raised: #131629;
    --border: #211F3A;
    --border-bright: #362F5C;
    --text: #DCE0F2;
    --text-dim: #5F6285;
    --accent: #43E6C4;
    --accent-glow: rgba(67, 230, 196, 0.35);
    --pink: #FF3D8A;
    --pink-glow: rgba(255, 61, 138, 0.4);
    --flag: #F0A857;
    --flag-glow: rgba(240, 168, 87, 0.25);
    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;

    background:
      radial-gradient(
        ellipse 900px 500px at 15% -5%,
        rgba(255,61,138,0.10),
        transparent 60%
      ),
      radial-gradient(
        ellipse 900px 500px at 90% 10%,
        rgba(67,230,196,0.08),
        transparent 60%
      ),
      linear-gradient(
        var(--grid-line) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        var(--grid-line) 1px,
        transparent 1px
      ),
      var(--bg);

    background-size:
      auto,
      auto,
      28px 28px,
      28px 28px,
      auto;

    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }


  /* =========================
     HEADER
     ========================= */

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;

    display: flex;
    align-items: center;

    gap: 14px;

    background:
      linear-gradient(
        180deg,
        rgba(6,8,18,0.9),
        rgba(6,8,18,0.6)
      );

    backdrop-filter: blur(6px);
  }


  .scope-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .scope-icon .ring {
    fill: none;
    stroke: var(--border-bright);
    stroke-width: 1;
  }

  .scope-icon .tick {
    stroke: var(--text-dim);
    stroke-width: 1;
  }

  .scope-icon .sweep {
    transform-origin: 11px 11px;
    animation: sweep 3.2s linear infinite;
  }

  .scope-icon .crosshair {
    fill: var(--accent);
  }

  @keyframes sweep {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }


  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;

    margin: 0;

    letter-spacing: 0.02em;

    background:
      linear-gradient(
        90deg,
        var(--accent) 0%,
        #7FE6D8 35%,
        var(--pink) 100%
      );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
  }


  header .tag {
    font-size: 11.5px;
    color: var(--text-dim);

    font-family: var(--mono);

    border-left: 1px solid var(--border);

    padding-left: 14px;
  }


  /* =========================
     MAIN
     ========================= */

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 32px;
  }


  .search-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);

    margin-bottom: 8px;

    letter-spacing: 0.03em;
  }


  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }


  #addressInput {
    flex: 1;

    background: var(--panel);

    border: 1px solid var(--border);

    color: var(--text);

    padding: 13px 16px;

    border-radius: 3px;

    font-family: var(--mono);

    font-size: 13px;

    outline: none;

    transition:
      border-color 0.15s,
      box-shadow 0.15s;
  }


  #addressInput:focus {
    border-color: var(--pink);

    box-shadow:
      0 0 0 3px var(--pink-glow);
  }


  #addressInput::placeholder {
    color: var(--text-dim);
  }


  #addressInput.invalid {
    border-color: #E15C5C;
  }


  .input-error {
    font-family: var(--mono);

    font-size: 11px;

    color: #E15C5C;

    margin-bottom: 24px;

    min-height: 14px;
  }


  /* =========================
     BUTTONS
     ========================= */

  button {
    position: relative;

    background: transparent;

    color: var(--accent);

    border: 1px solid var(--accent);

    padding: 13px 28px;

    font-weight: 700;

    font-size: 12.5px;

    font-family: var(--mono);

    letter-spacing: 0.08em;

    cursor: pointer;

    clip-path:
      polygon(
        10px 0,
        100% 0,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        0 100%,
        0 10px
      );

    overflow: hidden;

    transition:
      color 0.2s,
      border-color 0.2s;

    isolation: isolate;
  }


  button::before {
    content: '';

    position: absolute;

    inset: 0;

    background:
      linear-gradient(
        120deg,
        var(--accent) 0%,
        var(--pink) 100%
      );

    transform: translateX(-105%);

    transition:
      transform 0.28s ease;

    z-index: -1;
  }


  button:hover {
    color: #04140F;
    border-color: var(--pink);
  }


  button:hover::before {
    transform: translateX(0);
  }


  button:active {
    transform: scale(0.97);
  }


  button:disabled {
    opacity: 0.4;
    cursor: default;

    border-color: var(--border-bright);

    color: var(--text-dim);
  }


  button:disabled::before {
    display: none;
  }


  .btn-arrow {
    display: inline-block;

    transition:
      transform 0.2s;
  }


  button:hover .btn-arrow {
    transform: translateX(3px);
  }


  .btn-secondary {
    background: transparent;

    color: var(--text-dim);

    border: 1px solid var(--border-bright);

    padding: 8px 16px;

    font-size: 11px;

    clip-path: none;

    font-weight: 600;
  }


  .btn-secondary::before {
    display: none;
  }


  .btn-secondary:hover {
    color: var(--text);

    border-color: var(--text-dim);
  }


  /* =========================
     EMPTY STATE
     ========================= */

  .empty-state {
    border: 1px dashed var(--border);

    border-radius: 4px;

    padding: 60px 24px;

    text-align: center;

    color: var(--text-dim);

    font-size: 13px;

    font-family: var(--mono);
  }


  /* =========================
     SUMMARY
     ========================= */

  .summary-grid {
    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 1px;

    background: var(--border);

    border: 1px solid var(--border);

    border-radius: 4px;

    overflow: hidden;

    margin-bottom: 12px;

    position: relative;
  }


  .summary-grid::before {
    content: '';

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 2px;

    background:
      linear-gradient(
        90deg,
        var(--accent),
        var(--pink)
      );
  }


  .stat {
    background: var(--panel);

    padding: 18px 20px;

    position: relative;
  }


  .stat .label {
    font-size: 10.5px;

    color: var(--text-dim);

    margin-bottom: 8px;

    font-family: var(--mono);

    letter-spacing: 0.04em;

    text-transform: uppercase;
  }


  .stat .value {
    font-size: 21px;

    font-weight: 700;

    font-family: var(--mono);
  }


  .stat .value.accent {
    color: var(--accent);

    text-shadow:
      0 0 16px var(--accent-glow);
  }


  .stat .value.pink {
    color: var(--pink);

    text-shadow:
      0 0 16px var(--pink-glow);
  }


  .stat .value.muted {
    color: var(--text-dim);

    font-size: 15px;

    font-weight: 500;
  }


  .confidence-bar {
    height: 3px;

    background: var(--panel-raised);

    border-radius: 2px;

    margin-top: 10px;

    overflow: hidden;
  }


  .confidence-fill {
    height: 100%;

    background:
      linear-gradient(
        90deg,
        var(--pink),
        var(--accent)
      );

    box-shadow:
      0 0 8px var(--accent-glow);
  }


  /* =========================
     HOP NOTE
     ========================= */

  .hop-note {
    font-family: var(--mono);

    font-size: 11px;

    color: var(--text-dim);

    margin-bottom: 16px;

    padding: 0 2px;
  }


  .hop-note span {
    color: var(--pink);
  }


  /* =========================
     FLAGS
     ========================= */

  .flag-row {
    display: flex;

    align-items: center;

    gap: 10px;

    background: var(--panel);

    border: 1px solid var(--flag);

    box-shadow:
      0 0 20px -8px var(--flag-glow);

    color: var(--flag);

    padding: 12px 16px;

    border-radius: 4px;

    font-size: 12px;

    margin-bottom: 20px;

    font-family: var(--mono);
  }


  .flag-icon {
    width: 16px;
    height: 16px;

    border: 1px solid var(--flag);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 10px;

    flex-shrink: 0;
  }


  /* =========================
     PANELS
     ========================= */

  .panel-header {
    display: flex;

    justify-content: space-between;

    align-items: baseline;

    margin-bottom: 10px;
  }


  .panel-title {
    font-size: 11px;

    color: var(--text-dim);

    text-transform: uppercase;

    letter-spacing: 0.05em;

    font-family: var(--mono);
  }


  .panel-meta {
    font-size: 10.5px;

    color: var(--text-dim);

    font-family: var(--mono);
  }


  /* =========================
     GRAPH
     ========================= */

  #graph {
    background:
      radial-gradient(
        circle at 25% 15%,
        rgba(67,230,196,0.05),
        transparent 40%
      ),

      radial-gradient(
        circle at 80% 85%,
        rgba(255,61,138,0.05),
        transparent 40%
      ),

      var(--panel);

    border: 1px solid var(--border);

    border-radius: 4px;

    height: 520px;
  }


  /* =========================
     LEGEND
     ========================= */

  .legend {
    display: flex;

    gap: 20px;

    margin-top: 10px;

    font-family: var(--mono);

    font-size: 10.5px;

    color: var(--text-dim);

    flex-wrap: wrap;
  }


  .legend .dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    display: inline-block;

    margin-right: 6px;

    vertical-align: middle;
  }


  /* =========================
     CLUSTER INFO
     ========================= */

  .cluster-info {
    margin-top: 16px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 4px;

    padding: 16px;
  }


  .cluster-info-title {
    font-family: var(--mono);

    font-size: 11px;

    color: var(--text-dim);

    text-transform: uppercase;

    letter-spacing: 0.05em;

    margin-bottom: 12px;
  }


  .cluster-stats {
    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 10px;
  }


  .cluster-stat {
    background: var(--panel-raised);

    border: 1px solid var(--border);

    padding: 10px;

    border-radius: 3px;
  }


  .cluster-stat-label {
    font-family: var(--mono);

    font-size: 9px;

    color: var(--text-dim);

    margin-bottom: 5px;

    text-transform: uppercase;
  }


  .cluster-stat-value {
    font-family: var(--mono);

    font-size: 15px;

    color: var(--accent);

    font-weight: 700;
  }


  .vasp-evidence {
    margin-top: 14px;

    padding-top: 14px;

    border-top: 1px solid var(--border);

    font-family: var(--mono);

    font-size: 11px;

    color: var(--text-dim);
  }


  .vasp-evidence strong {
    color: var(--pink);
  }


  .cluster-members {
    margin-top: 10px;

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
  }


  .cluster-member {
    border: 1px solid var(--border-bright);

    background: var(--panel-raised);

    color: var(--text);

    padding: 5px 8px;

    border-radius: 3px;

    font-family: var(--mono);

    font-size: 9px;
  }


  /* =========================
     FOOTER
     ========================= */

  .footer-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 14px;
  }


  .footer-note {
    font-size: 11px;

    color: var(--text-dim);

    font-family: var(--mono);
  }


  /* =========================
     LOADING
     ========================= */

  .loading {
    color: var(--pink);

    font-size: 13px;

    padding: 24px 0;

    font-family: var(--mono);
  }


  .loading::after {
    content: '▍';

    animation:
      blink 0.9s step-end infinite;
  }


  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

</style>
</head>


<body>


<header>

  <svg class="scope-icon" viewBox="0 0 22 22">

    <circle
      class="ring"
      cx="11"
      cy="11"
      r="9.5"
    />

    <circle
      class="ring"
      cx="11"
      cy="11"
      r="5.5"
      opacity="0.6"
    />

    <line
      class="tick"
      x1="11"
      y1="1"
      x2="11"
      y2="3"
    />

    <line
      class="tick"
      x1="11"
      y1="19"
      x2="11"
      y2="21"
    />

    <line
      class="tick"
      x1="1"
      y1="11"
      x2="3"
      y2="11"
    />

    <line
      class="tick"
      x1="19"
      y1="11"
      x2="21"
      y2="11"
    />

    <g class="sweep">

      <path
        d="M 11 11 L 11 1.5 A 9.5 9.5 0 0 1 18.7 5.3 Z"
        fill="url(#sweepGrad)"
        opacity="0.55"
      />

    </g>

    <circle
      class="crosshair"
      cx="11"
      cy="11"
      r="1.6"
    />

    <defs>

      <linearGradient
        id="sweepGrad"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
      >

        <stop
          offset="0%"
          stop-color="#43E6C4"
        />

        <stop
          offset="100%"
          stop-color="#43E6C4"
          stop-opacity="0"
        />

      </linearGradient>

    </defs>

  </svg>


  <h1>
    CRYPTOTRACE // VASP-ATTRIBUTION
  </h1>


  <span class="tag">
    SIH26182 · graph intelligence prototype
  </span>

</header>



<main>

  <div class="search-label">
    $ trace --address
  </div>


  <div class="search-row">

    <input
      id="addressInput"
      type="text"
      placeholder="Enter Ethereum wallet address..."
      value=""
    />


    <button
      id="searchBtn"
      onclick="lookup()"
    >
      RUN TRACE
      <span class="btn-arrow">→</span>
    </button>

  </div>


  <div
    class="input-error"
    id="inputError"
  ></div>


  <div id="output">

    <div class="empty-state">
      // awaiting input — enter an Ethereum wallet address and run trace
    </div>

  </div>

</main>



<script>

  let sweepIntervalId = null;

  let lastResult = null;



  /* =========================================
     ETHEREUM ADDRESS VALIDATION
     ========================================= */

  function isValidAddress(addr) {

    return /^0x[a-fA-F0-9]{40}$/.test(addr);

  }



  /* =========================================
     LOOKUP
     ========================================= */

  async function lookup() {

    const address =
      document
        .getElementById('addressInput')
        .value
        .trim();


    const btn =
      document.getElementById('searchBtn');


    const output =
      document.getElementById('output');


    const input =
      document.getElementById('addressInput');


    const errorEl =
      document.getElementById('inputError');


    errorEl.textContent = '';

    input.classList.remove('invalid');


    /* -----------------------------------------
       Empty address
       ----------------------------------------- */

    if (!address) {

      errorEl.textContent =
        '// wallet address is required';

      input.classList.add('invalid');

      return;

    }


    /* -----------------------------------------
       Ethereum address validation
       ----------------------------------------- */

    if (!isValidAddress(address)) {

      errorEl.textContent =
        '// invalid Ethereum wallet address — expected 0x + 40 hexadecimal characters';

      input.classList.add('invalid');

      return;

    }


    btn.disabled = true;


    output.innerHTML =
      '<div class="loading">fetching Etherscan transaction data and analyzing graph</div>';


    try {

      /* -----------------------------------------
         Call OUR Flask backend API
         
         Frontend does NOT call Etherscan directly.
         Our backend calls Etherscan securely.
         ----------------------------------------- */

      const res =
        await fetch(
          `http://localhost:5000/api/attribute?address=${encodeURIComponent(address)}`
        );


      let data;

      try {

        data = await res.json();

      } catch (jsonError) {

        throw new Error(
          'Backend returned an invalid response'
        );

      }


      /* -----------------------------------------
         Backend error
         ----------------------------------------- */

      if (!res.ok || data.error) {

        throw new Error(
          data.message ||
          data.error ||
          `Backend request failed (${res.status})`
        );

      }


      lastResult = data;


      renderResult(data);


    } catch (err) {

      output.innerHTML =
        `
        <div class="empty-state">
          // error — ${escapeHtml(err.message)}
        </div>
        `;

    } finally {

      btn.disabled = false;

    }

  }



  /* =========================================
     HTML ESCAPE
     ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }



  /* =========================================
     SHORTEN ADDRESS
     ========================================= */

  function shortenAddress(address) {

    if (!address) {
      return '';
    }

    if (address.length <= 18) {
      return address;
    }

    return (
      address.slice(0, 10) +
      '…' +
      address.slice(-6)
    );

  }



  /* =========================================
     RENDER RESULT
     ========================================= */

  function renderResult(data) {

    const output =
      document.getElementById('output');


    const conf =
      data.confidence || 0;


    const flags =
      data.flags || [];


    const graph =
      data.graph_analysis || {};


    const vaspConnections =
      graph.vasp_connections || [];


    /* -----------------------------------------
       DATA SOURCE
       ----------------------------------------- */

    const sourceLabel =
      data.data_source === 'etherscan'
        ? 'Etherscan API'
        : 'Unknown';



    let html = `

      <div class="summary-grid">


        <div class="stat">

          <div class="label">
            Transactions
          </div>

          <div class="value">
            ${data.tx_count || 0}
          </div>

        </div>


        <div class="stat">

          <div class="label">
            Matched VASP
          </div>

          <div class="value ${
            data.matched_vasp
              ? 'pink'
              : 'muted'
          }">

            ${
              escapeHtml(
                data.matched_vasp ||
                'NO DIRECT MATCH'
              )
            }

          </div>

        </div>


        <div class="stat">

          <div class="label">
            Confidence
          </div>

          <div class="value ${
            conf > 0
              ? 'accent'
              : 'muted'
          }">

            ${conf}%

          </div>


          <div class="confidence-bar">

            <div
              class="confidence-fill"
              style="width:${Math.min(conf, 100)}%"
            ></div>

          </div>

        </div>


        <div class="stat">

          <div class="label">
            Graph Cluster
          </div>

          <div class="value accent">

            ${
              graph.suspect_cluster
                ? '#' + graph.suspect_cluster
                : 'N/A'
            }

          </div>

        </div>

      </div>

    `;



    /* =========================================
       GRAPH INFORMATION NOTE
       ========================================= */

    if (
      graph.suspect_cluster &&
      graph.cluster_size
    ) {

      html += `

        <div class="hop-note">

          // suspect belongs to
          <span>
            cluster ${graph.suspect_cluster}
          </span>

          containing
          <span>
            ${graph.cluster_size} wallets
          </span>

        </div>

      `;

    }



    /* =========================================
       DIRECT / HOP INFORMATION
       ========================================= */

    if (
      data.matched_vasp &&
      data.hops === 1 &&
      data.matched_via
    ) {

      html += `

        <div class="hop-note">

          // matched via
          <span>1 hop</span>
          through
          ${shortenAddress(data.matched_via)}

        </div>

      `;

    }

    else if (
      data.matched_vasp &&
      data.hops === 0
    ) {

      html += `

        <div class="hop-note">

          // <span>direct</span>
          transaction with matched VASP

        </div>

      `;

    }



    /* =========================================
       FLAGS
       ========================================= */

    if (flags.length > 0) {

      html += `

        <div class="flag-row">

          <span class="flag-icon">
            !
          </span>

          FLAGGED —

          ${flags
            .map(flag => {

              if (typeof flag === 'string') {
                return escapeHtml(flag);
              }

              return escapeHtml(
                flag.type ||
                'UNKNOWN'
              );

            })
            .join(', ')
            .replace(/_/g,' ')
            .toUpperCase()
          }

        </div>

      `;

    }



    /* =========================================
       GRAPH PANEL
       ========================================= */

    html += `

      <div class="panel-header">

        <span class="panel-title">
          Transaction Graph
        </span>

        <span class="panel-meta">

          ${
            graph.nodes || 0
          }
          nodes ·

          ${
            graph.edges || 0
          }
          edges ·

          ${
            graph.clusters
              ? graph.clusters.length
              : 0
          }
          clusters

        </span>

      </div>


      <div id="graph"></div>


      <div class="legend">


        <span>

          <span
            class="dot"
            style="background:#43E6C4;"
          ></span>

          Searched address

        </span>


        <span>

          <span
            class="dot"
            style="background:#FF3D8A;"
          ></span>

          Known VASP

        </span>


        <span>

          <span
            class="dot"
            style="background:#5F6285;"
          ></span>

          Wallet

        </span>


        <span>

          <span
            class="dot"
            style="background:#8B7CFF;"
          ></span>

          Same cluster

        </span>

      </div>

    `;



    /* =========================================
       CLUSTER INFORMATION
       ========================================= */

    if (graph.suspect_cluster) {

      const suspectCluster =
        graph.clusters
          ? graph.clusters.find(
              cluster =>
                cluster.cluster_id ===
                graph.suspect_cluster
            )
          : null;


      if (suspectCluster) {

        html += `

          <div class="cluster-info">

            <div class="cluster-info-title">

              Suspect Cluster Analysis

            </div>


            <div class="cluster-stats">


              <div class="cluster-stat">

                <div class="cluster-stat-label">
                  Wallets
                </div>

                <div class="cluster-stat-value">
                  ${suspectCluster.wallet_count}
                </div>

              </div>


              <div class="cluster-stat">

                <div class="cluster-stat-label">
                  Internal Edges
                </div>

                <div class="cluster-stat-value">
                  ${suspectCluster.internal_edges}
                </div>

              </div>


              <div class="cluster-stat">

                <div class="cluster-stat-label">
                  Transaction Weight
                </div>

                <div class="cluster-stat-value">
                  ${suspectCluster.total_transaction_weight}
                </div>

              </div>


              <div class="cluster-stat">

                <div class="cluster-stat-label">
                  Avg Degree
                </div>

                <div class="cluster-stat-value">
                  ${suspectCluster.average_degree}
                </div>

              </div>


            </div>



            ${
              vaspConnections.length > 0
                ? `

                  <div class="vasp-evidence">

                    Known VASP connection in
                    suspect cluster:

                    ${
                      vaspConnections
                        .map(
                          vasp =>
                            `<strong>${escapeHtml(vasp.vasp_name)}</strong>`
                        )
                        .join(', ')
                    }

                  </div>

                `
                : `

                  <div class="vasp-evidence">

                    No known VASP address found
                    inside suspect cluster.

                  </div>

                `
            }



            <div class="cluster-members">

              ${
                suspectCluster.members
                  .map(
                    wallet => `
                      <span class="cluster-member">
                        ${escapeHtml(wallet)}
                      </span>
                    `
                  )
                  .join('')
              }

            </div>

          </div>

        `;

      }

    }



    /* =========================================
       FOOTER
       ========================================= */

    html += `

      <div class="footer-row">

        <div class="footer-note">

          // data source:
          ${sourceLabel} ·
          NetworkX + Louvain

        </div>


        <button
          class="btn-secondary"
          onclick="exportReport()"
        >

          ↓ EXPORT JSON

        </button>

      </div>

    `;



    output.innerHTML = html;


    renderGraph(data);

  }



  /* =========================================
     EXPORT REPORT
     ========================================= */

  function exportReport() {

    if (!lastResult) {
      return;
    }


    const blob =
      new Blob(
        [
          JSON.stringify(
            lastResult,
            null,
            2
          )
        ],
        {
          type: 'application/json'
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement('a');


    a.href = url;


    a.download =
      `graph-analysis-report-${
        lastResult.address.slice(0,8)
      }.json`;


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);

  }



  /* =========================================
     RENDER GRAPH
     
     Uses graph_analysis returned by
     graph_analysis.py
     ========================================= */

  function renderGraph(data) {

    if (sweepIntervalId) {

      clearInterval(
        sweepIntervalId
      );

      sweepIntervalId = null;

    }


    const graph =
      data.graph_analysis;


    if (
      !graph ||
      !graph.graph_nodes ||
      !graph.graph_edges
    ) {

      document.getElementById('graph').innerHTML =
        `
        <div class="empty-state">
          // graph data unavailable
        </div>
        `;

      return;

    }



    /* =========================================
       CREATE NODES
       ========================================= */

    const nodes =
      graph.graph_nodes.map(node => {


        const isSuspect =
          node.id.toLowerCase() ===
          data.address.toLowerCase();


        const vasp =
          graph.vasp_connections
            ? graph.vasp_connections.find(
                v =>
                  v.address.toLowerCase() ===
                  node.id.toLowerCase()
              )
            : null;


        const isVASP =
          Boolean(vasp);


        const isSameCluster =
          node.cluster ===
          graph.suspect_cluster;


        let background;

        let border;

        let fontColor;

        let size;



        /* -------------------------
           SUSPECT
           ------------------------- */

        if (isSuspect) {

          background =
            '#43E6C4';

          border =
            '#1F7A68';

          fontColor =
            '#04140F';

          size =
            28;

        }



        /* -------------------------
           VASP
           ------------------------- */

        else if (isVASP) {

          background =
            '#2A1122';

          border =
            '#FF3D8A';

          fontColor =
            '#FF3D8A';

          size =
            23;

        }



        /* -------------------------
           SAME CLUSTER
           ------------------------- */

        else if (isSameCluster) {

          background =
            '#19182E';

          border =
            '#8B7CFF';

          fontColor =
            '#DCE0F2';

          size =
            17;

        }



        /* -------------------------
           OTHER CLUSTER
           ------------------------- */

        else {

          background =
            '#131629';

          border =
            '#362F5C';

          fontColor =
            '#DCE0F2';

          size =
            14;

        }



        return {

          id: node.id,

          label: node.label,


          color: {

            background:
              background,

            border:
              border

          },


          font: {

            color:
              fontColor,

            face:
              'JetBrains Mono',

            size:
              10

          },


          shape:
            'dot',


          size:
            size,


          borderWidth:
            isSuspect || isVASP
              ? 2
              : 1,


          title:

            `Wallet: ${node.id}\n` +

            `Cluster: ${node.cluster}` +

            (
              isVASP
                ? `\nVASP: ${vasp.vasp_name}`
                : ''
            )

        };

      });



    /* =========================================
       CREATE EDGES
       ========================================= */

    const edges =
      graph.graph_edges.map(
        (edge, index) => {


          const isVASPConnection =
            graph.vasp_connections &&
            graph.vasp_connections.some(
              vasp =>
                vasp.address.toLowerCase() ===
                edge.to.toLowerCase()
            );


          const fromNode =
            graph.graph_nodes.find(
              n =>
                n.id === edge.from
            );


          const toNode =
            graph.graph_nodes.find(
              n =>
                n.id === edge.to
            );


          const sameCluster =
            fromNode &&
            toNode &&
            fromNode.cluster ===
            toNode.cluster;



          return {

            id:
              index,


            from:
              edge.from,


            to:
              edge.to,


            arrows:
              'to',


            width:
              Math.max(
                1,
                Math.min(
                  edge.weight || 1,
                  5
                )
              ),


            label:
              edge.weight > 1
                ? `×${edge.weight}`
                : '',


            font: {

              color:
                '#5F6285',

              face:
                'JetBrains Mono',

              size:
                9,

              align:
                'middle'

            },


            color: {

              color:
                isVASPConnection
                  ? '#FF3D8A'
                  : sameCluster
                    ? '#6F65B8'
                    : '#2E4463',


              highlight:
                '#43E6C4'

            },


            smooth: {

              type:
                'dynamic'

            }

          };

        }
      );



    /* =========================================
       CREATE NETWORK
       ========================================= */

    const container =
      document.getElementById(
        'graph'
      );


    const network =
      new vis.Network(

        container,

        {

          nodes:
            new vis.DataSet(
              nodes
            ),

          edges:
            new vis.DataSet(
              edges
            )

        },

        {

          physics: {

            enabled:
              true,

            stabilization:
              true,


            barnesHut: {

              gravitationalConstant:
                -3000,

              centralGravity:
                0.2,

              springLength:
                150,

              springConstant:
                0.04,

              damping:
                0.09

            }

          },


          interaction: {

            hover:
              true,

            navigationButtons:
              true,

            keyboard:
              true,

            zoomView:
              true,

            dragView:
              true

          },


          nodes: {

            borderWidth:
              1

          },


          edges: {

            arrows: {

              to: {

                enabled:
                  true,

                scaleFactor:
                  0.6

              }

            }

          }

        }

      );



    /* =========================================
       HIGHLIGHT SUSPECT WITH ANIMATED RING
       ========================================= */

    let sweepAngle = 0;


    network.on(
      'afterDrawing',
      function(ctx) {


        const positions =
          network.getPositions(
            [data.address]
          );


        const pos =
          positions[data.address];


        if (!pos) {
          return;
        }


        const ringRadius =
          42;


        ctx.save();



        /* Outer ring */

        ctx.strokeStyle =
          'rgba(67,230,196,0.22)';


        ctx.lineWidth =
          1;


        ctx.beginPath();


        ctx.arc(

          pos.x,
          pos.y,

          ringRadius,

          0,
          Math.PI * 2

        );


        ctx.stroke();



        /* Animated sweep */

        const grad =
          ctx.createLinearGradient(

            pos.x,
            pos.y,

            pos.x + ringRadius,
            pos.y

          );


        grad.addColorStop(
          0,
          'rgba(67,230,196,0.9)'
        );


        grad.addColorStop(
          1,
          'rgba(67,230,196,0)'
        );


        ctx.strokeStyle =
          grad;


        ctx.lineWidth =
          2;


        ctx.beginPath();


        ctx.arc(

          pos.x,
          pos.y,

          ringRadius,

          sweepAngle,
          sweepAngle + 0.6

        );


        ctx.stroke();


        ctx.restore();

      }
    );



    /* =========================================
       ANIMATE RING
       ========================================= */

    sweepIntervalId =
      setInterval(
        () => {

          sweepAngle +=
            0.035;

          network.redraw();

        },
        30
      );

  }



  /* =========================================
     ENTER KEY SUPPORT
     ========================================= */

  document
    .getElementById('addressInput')
    .addEventListener(
      'keydown',
      function(event) {

        if (
          event.key === 'Enter'
        ) {

          lookup();

        }

      }
    );

</script>
